<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEYA Dental 管理系统 - 登录</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 48px 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        .login-logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .login-logo h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #1a1a2e, #4cc9f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .login-logo p {
            color: #6c757d;
            font-size: 0.9rem;
            margin-top: 4px;
        }
        .form-floating {
            margin-bottom: 16px;
        }
        .form-floating input {
            border: 2px solid #e9ecef;
            border-radius: 12px;
            padding: 16px 12px;
            height: auto;
        }
        .form-floating input:focus {
            border-color: #4cc9f0;
            box-shadow: 0 0 0 4px rgba(76, 201, 240, 0.15);
        }
        .form-floating label {
            padding: 12px;
        }
        .btn-login {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            background: linear-gradient(135deg, #4cc9f0, #4361ee);
            border: none;
            color: #fff;
            transition: all 0.2s;
        }
        .btn-login:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(76, 201, 240, 0.4);
        }
        .btn-login:disabled {
            opacity: 0.6;
            transform: none;
        }
        .alert {
            border-radius: 12px;
            display: none;
        }
        .footer {
            text-align: center;
            margin-top: 24px;
            color: #adb5bd;
            font-size: 0.8rem;
        }
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-logo">
            <h1>🦷 MEYA Dental</h1>
            <p>管理系统</p>
        </div>

        <div class="alert alert-danger" id="errorAlert" role="alert"></div>

        <form id="loginForm" onsubmit="return handleLogin(event)">
            <div class="form-floating">
                <input type="text" class="form-control" id="username"
                       placeholder="用户名" autocomplete="username" autofocus required>
                <label for="username">👤 用户名</label>
            </div>
            <div class="form-floating">
                <input type="password" class="form-control" id="password"
                       placeholder="密码" autocomplete="current-password" required>
                <label for="password">🔒 密码</label>
            </div>
            <button type="submit" class="btn btn-login" id="loginBtn">
                <span id="btnText">登 录</span>
                <div class="spinner" id="btnSpinner"></div>
            </button>
        </form>

        <div class="footer">
            <p>默认账号: admin / admin123</p>
        </div>
    </div>

    <script>
    async function handleLogin(e) {
        e.preventDefault();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();
        const btn = document.getElementById('loginBtn');
        const btnText = document.getElementById('btnText');
        const spinner = document.getElementById('btnSpinner');
        const alert = document.getElementById('errorAlert');

        if (!username || !password) {
            showError('请输入用户名和密码');
            return false;
        }

        btn.disabled = true;
        btnText.style.display = 'none';
        spinner.style.display = 'block';
        alert.style.display = 'none';

        try {
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username, password})
            });
            const data = await res.json();

            if (data.success) {
                window.location.href = '/';
            } else {
                showError(data.error || '登录失败');
                btn.disabled = false;
                btnText.style.display = 'inline';
                spinner.style.display = 'none';
            }
        } catch (err) {
            showError('网络错误，请重试');
            btn.disabled = false;
            btnText.style.display = 'inline';
            spinner.style.display = 'none';
        }
        return false;
    }

    function showError(msg) {
        const alert = document.getElementById('errorAlert');
        alert.textContent = msg;
        alert.style.display = 'block';
    }

    // Auto-focus username on load
    document.getElementById('username').focus();
    </script>
</body>
</html>
