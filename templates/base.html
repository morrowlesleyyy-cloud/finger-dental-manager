<!DOCTYPE html>
<html lang="zh-CN" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEYA Dental 管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
    <style>
        :root {
            --sidebar-width: 240px;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: #f5f6fa;
        }
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: var(--sidebar-width);
            height: 100vh;
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            z-index: 1000;
            overflow-y: auto;
        }
        .sidebar-brand {
            padding: 20px;
            font-size: 1.2rem;
            font-weight: 700;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .sidebar-brand small {
            font-size: 0.7rem;
            opacity: 0.6;
            font-weight: 400;
        }
        .sidebar .nav-link {
            color: rgba(255,255,255,0.7);
            padding: 12px 20px;
            border-left: 3px solid transparent;
            transition: all 0.2s;
        }
        .sidebar .nav-link:hover, .sidebar .nav-link.active {
            color: #fff;
            background: rgba(255,255,255,0.08);
            border-left-color: #4cc9f0;
        }
        .sidebar .nav-link i {
            width: 22px;
            margin-right: 8px;
        }
        .main-content {
            margin-left: var(--sidebar-width);
            min-height: 100vh;
        }
        .page-header {
            padding: 20px 30px;
            background: #fff;
            border-bottom: 1px solid #e9ecef;
        }
        .page-body {
            padding: 24px 30px;
        }
        .stat-card {
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        }
        .stat-card .icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
        }
        .stat-card .value {
            font-size: 1.8rem;
            font-weight: 700;
        }
        .stat-card .label {
            font-size: 0.85rem;
            color: #6c757d;
        }
        .badge-outline {
            background: transparent;
            border: 1px solid currentColor;
        }
        .table-hover tbody tr {
            cursor: pointer;
        }
        .table-hover tbody tr:hover {
            background: #f0f7ff;
        }
        .chart-container {
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .consultant-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }
        .toast-container {
            z-index: 9999;
        }
        .modal-content {
            border: none;
            border-radius: 12px;
        }
        .modal-header {
            border-bottom: 1px solid #eee;
            padding: 16px 20px;
        }
        .modal-body {
            padding: 20px;
        }
        .form-label {
            font-weight: 500;
            font-size: 0.9rem;
        }
        .page-title {
            font-size: 1.3rem;
            font-weight: 600;
        }
        /* Tooth Cross Grid */
        .tooth-cross { display: inline-block; }
        .tooth-cross-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            width: 160px;
            height: 100px;
            border-radius: 4px;
            overflow: hidden;
        }
        .tc-cell {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3px;
        }
        .tc-ur { border-right: 1px solid #ccc; border-bottom: 1px solid #ccc; }
        .tc-ul { border-bottom: 1px solid #ccc; }
        .tc-lr { border-right: 1px solid #ccc; }
        .tc-label {
            font-size: 10px;
            font-weight: 700;
            color: #888;
            text-transform: uppercase;
            line-height: 1;
        }
        .tc-input {
            width: 100%;
            font-size: 11px;
            text-align: center;
            padding: 2px 4px;
            border-radius: 3px;
            border: 1px solid #ddd;
            background: #fff;
        }
        .tc-input:focus {
            border-color: #e94560;
            box-shadow: 0 0 0 0.15rem rgba(233,69,96,0.15);
            outline: none;
        }
        /* Compact cross for detail modal */
        .tooth-cross-mini-grid {
            display: inline-grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            width: 100px;
            height: 64px;
            border-radius: 4px;
            overflow: hidden;
        }
        .tcm-cell {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            padding: 2px;
        }
        .tcm-cell code {
            font-size: 11px;
            background: none;
            color: #333;
        }
        .tcm-ur { border-right: 1px solid #ccc; border-bottom: 1px solid #ccc; }
        .tcm-ul { border-bottom: 1px solid #ccc; }
        .tcm-lr { border-right: 1px solid #ccc; }
        .tooth-cross-mini { font-size: 11px; line-height: 1.6; }
        .tcm-cell-inline { display: inline-block; margin-right: 8px; }
        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
            }
            .main-content {
                margin-left: 0;
            }
            .page-body {
                padding: 16px;
            }
        }
    </style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
    <div class="sidebar-brand">
        🦷 MEYA Dental
    </div>
    <nav class="nav flex-column mt-2">
        <a class="nav-link" href="/" data-page="dashboard">

        </a>

        <a class="nav-link" href="/appointments" data-page="appointments">

        </a>
        <a class="nav-link" href="/followups" data-page="followups">

        <a class="nav-link" href="/reports" data-page="reports">

        </a>

        </a>

        </a>
        <a class="nav-link" href="/consultations" data-page="consultations">

        </a>
        <a class="nav-link" href="/employees" data-page="employees" id="navEmployees" style="display:none">

</div>

<!-- Main Content -->
<div class="main-content" id="mainContent">
    <div class="page-header d-flex justify-content-between align-items-center">
        <h5 class="page-title mb-0" id="pageTitle">首页看板</h5>

</div>

<!-- Form Modal -->
<div class="modal fade" id="formModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h6 class="modal-title" id="formModalLabel"></h6>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="formBody"></div>
            <div class="modal-footer border-0 pt-0">
                <button class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button class="btn btn-primary" onclick="saveForm()">保存</button>
            </div>
        </div>
    </div>
</div>

<!-- Detail Modal -->
<div class="modal fade" id="detailModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h6 class="modal-title" id="detailModalLabel">患者详情</h6>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="detailModalBody"></div>
        </div>
    </div>
</div>

<!-- Toast container -->
<div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="liveToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="toast-header">
            <i class="bi bi-info-circle me-2"></i>
            <strong class="me-auto" id="toastTitle">提示</strong>
            <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
        </div>
        <div class="toast-body" id="toastBody"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/zh.js"></script>
<script>
Chart.register(ChartDataLabels);
// ===================== Utility Functions =====================

// Global fetch wrapper to handle 401
const originalFetch = window.fetch;
window.fetch = async (...args) => {
    const res = await originalFetch(...args);
    if (res.status === 401) {
        const isApi = typeof args[0] === 'string' && args[0].startsWith('/api/');
        if (isApi) {
            // Session expired, redirect to login
            window.location.href = '/login';
        }
    }
    return res;
};

function showToast(message, type = 'success') {
    const toast = document.getElementById('liveToast');
    const body = document.getElementById('toastBody');
    const title = document.getElementById('toastTitle');
    const icon = toast.querySelector('.toast-header i');

    body.textContent = message;
    if (type === 'success') {
        title.textContent = '✅ 成功';
        icon.className = 'bi bi-check-circle text-success me-2';
    } else if (type === 'error') {
        title.textContent = '❌ 错误';
        icon.className = 'bi bi-exclamation-triangle text-danger me-2';
    } else {
        title.textContent = 'ℹ️ 提示';
        icon.className = 'bi bi-info-circle text-info me-2';
    }
    const bsToast = new bootstrap.Toast(toast);
    bsToast.show();
}

function saveForm() {
    const type = document.getElementById('formType')?.value;
    if (type === 'patient') savePatientForm();
    else if (type === 'appointment') saveAppointmentForm();
    else if (type === 'followup') saveFollowupForm();
    else if (type === 'transaction') saveTransactionForm();
    else if (type === 'employee') saveEmployeeForm();
    else showToast('未知表单类型', 'error');
}

function timePickerHtml(id, selected) {
    selected = selected || '';
    // Parse existing time like "2:00 PM" or "10:30AM"
    var match = selected.match(/(\d+):(\d+)\s*(AM|PM)/i);
    var selHour = match ? parseInt(match[1]) : '';
    var selMin = match ? match[2] : '00';
    var selAmpm = match ? match[3].toUpperCase() : '';

    var h = '<select class="form-select form-select-sm" id="' + id + '_hour" style="width:70px"><option value="">时</option>';
    for (var i = 1; i <= 12; i++) {
        h += '<option value="' + i + '"' + (selHour === i ? ' selected' : '') + '>' + i + '</option>';
    }
    h += '</select>';

    var m = '<select class="form-select form-select-sm" id="' + id + '_min" style="width:80px"><option value="">分</option>';
    ['00','15','30','45'].forEach(function(v) {
        m += '<option value="' + v + '"' + (selMin === v ? ' selected' : '') + '>' + v + '</option>';
    });
    m += '</select>';

    var a = '<select class="form-select form-select-sm" id="' + id + '_ampm" style="width:80px"><option value="">—</option>';
    ['AM','PM'].forEach(function(v) {
        a += '<option value="' + v + '"' + (selAmpm === v ? ' selected' : '') + '>' + v + '</option>';
    });
    a += '</select>';

    return '<div class="d-flex gap-1">' + h + m + a + '</div>';
}

function getTimePickerValue(id) {
    var h = document.getElementById(id + '_hour').value;
    var m = document.getElementById(id + '_min').value;
    var a = document.getElementById(id + '_ampm').value;
    if (!h || !a) return '';
    return h + ':' + (m || '00') + ' ' + a;
}

function formatMoney(n) {
    if (!n || n === 0) return 'RM 0';
    return 'RM ' + Number(n).toLocaleString('en-MY', {minimumFractionDigits: 0});
}

function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = String(text);
    return div.innerHTML;
}

// ===================== Router =====================

const PAGES = {
    dashboard: { title: '首页看板', render: renderDashboard },
    patients: { title: '患者管理', render: renderPatients },
    appointments: { title: '初诊预约', render: renderAppointments },
    followups: { title: '复诊预约', render: renderFollowups },
    transactions: { title: '成交管理', render: renderTransactions },
    reports: { title: '数据报表', render: renderReports },
    employees: { title: '员工管理', render: renderEmployees },
    'patient-images': { title: '患者图片', render: renderPatientImages },
    'treatment-plans': { title: '治疗方案', render: renderTreatmentPlans },
    'consultations': { title: '咨询管理', render: renderConsultations },
    'performance': { title: '业绩管理', render: renderPerformance },
};

function navigateTo(page) {
    // Update URL
    const url = page === 'dashboard' ? '/' : '/' + page;
    window.history.pushState({}, '', url);

    // Permission check
    var perms = window.__permissions || {};
    var permMap = {
        appointments: 'can_view_appointments',
        followups: 'can_view_appointments',
        transactions: 'can_view_transactions',
        reports: 'can_view_reports',
        performance: 'can_view_performance',
        'patient-images': 'can_view_images',
        'treatment-plans': 'can_view_treatment_plans',
        consultations: 'can_view_consultations',
    };
    if (permMap[page] && !perms.is_admin && !perms[permMap[page]]) {
        showToast('权限不足，无法访问该页面', 'error');
        page = 'dashboard';
        window.history.pushState({}, '', '/');
    }

    // Update sidebar
    document.querySelectorAll('.sidebar .nav-link').forEach(el => {
        el.classList.toggle('active', el.dataset.page === page);
    });

    // Render page
    const entry = PAGES[page];
    if (entry) {
        document.getElementById('pageTitle').textContent = entry.title;
        document.getElementById('pageBody').innerHTML = '<div class="text-center py-5"><div class="spinner-border text-primary" role="status"></div><p class="mt-2 text-muted">加载中...</p></div>';
        entry.render();
    }
}

function refreshPage() {
    const page = getCurrentPage();
    const entry = PAGES[page];
    if (entry) entry.render();
}

function getCurrentPage() {
    const path = window.location.pathname;
    if (path === '/' || path === '') return 'dashboard';
    return path.replace('/', '');
}

// ===================== Auth Check =====================

async function checkAuth() {
    try {
        const res = await fetch('/api/auth/check');
        const data = await res.json();
        if (data.logged_in) {
            const name = data.display_name || data.username;
            document.getElementById('userDisplay').textContent = '👤 ' + name;
            window.__displayName = name;
            
            // Show / hide nav items based on permissions
            if (data.permissions) {
                var p = data.permissions;
                document.getElementById('navEmployees').style.display = p.is_admin ? '' : 'none';
                // Only hide restricted pages for non-admin staff
                if (!p.is_admin) {
                    toggleNavLink('appointments', p.can_view_appointments);
                    toggleNavLink('followups', p.can_view_appointments);
                    toggleNavLink('transactions', p.can_view_transactions);
                    toggleNavLink('reports', p.can_view_reports);
                    toggleNavLink('performance', p.can_view_performance);
                    toggleNavLink('patient-images', p.can_view_images);
                    toggleNavLink('treatment-plans', p.can_view_treatment_plans);
                    toggleNavLink('consultations', p.can_view_consultations);
                }
            }
            
            // Update page routing to respect permissions
            window.__permissions = data.permissions || {};
            return true;
        } else {
            window.location.href = '/login';
            return false;
        }
    } catch (e) {
        window.location.href = '/login';
        return false;
    }
}

function toggleNavLink(page, show) {
    var link = document.querySelector('.sidebar .nav-link[data-page="' + page + '"]');
    if (link) link.style.display = show ? '' : 'none';
}

async function handleLogout() {
    await fetch('/api/logout', {method: 'POST'});
    window.location.href = '/login';
}

// Initial load
window.addEventListener('DOMContentLoaded', async () => {
    const authed = await checkAuth();
    if (!authed) return;
    updateClock();
    setInterval(updateClock, 1000);
    navigateTo(getCurrentPage());
});

// Handle browser back/forward
window.addEventListener('popstate', () => {
    navigateTo(getCurrentPage());
});

// Sidebar click
document.querySelectorAll('.sidebar .nav-link').forEach(el => {
    el.addEventListener('click', (e) => {
        e.preventDefault();
        navigateTo(el.dataset.page);
    });
});

function updateClock() {
    const now = new Date();
    const opts = { year: 'numeric', month: '2-digit', day: '2-digit', weekday: 'short',
                   hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Kuala_Lumpur' };
    document.getElementById('clockDisplay').textContent = now.toLocaleString('zh-CN', opts);
}

// ===================== SSE =====================

let eventSource = null;

function connectSSE() {
    if (eventSource) eventSource.close();
    eventSource = new EventSource('/api/events');

    eventSource.addEventListener('connected', () => {
        console.log('SSE connected');
    });

    ['patient_created', 'patient_updated', 'patient_deleted',
     'appointment_created', 'appointment_updated', 'appointment_deleted',
     'transaction_created', 'transaction_updated', 'transaction_deleted',
     'consultation_created', 'consultation_updated', 'consultation_deleted'].forEach(evt => {
        eventSource.addEventListener(evt, () => {
            const page = getCurrentPage();
            // Refresh dashboard if on dashboard
            if (page === 'dashboard') {
                renderDashboard();
            }
            // Refresh consultations page if open
            if (page === 'consultations') {
                renderConsultations();
            }
        });
    });

    eventSource.onerror = () => {
        console.log('SSE error, reconnecting...');
        setTimeout(connectSSE, 3000);
    };
}

// Start SSE after initial load
setTimeout(connectSSE, 1000);

// ===================== Dashboard =====================

async function renderDashboard() {
    const body = document.getElementById('pageBody');
    try {
        const res = await fetch('/api/dashboard');
        const data = await res.json();

        body.innerHTML = `
            <!-- Stat Cards -->
            <div class="row g-3 mb-4" id="statCards">
                <div class="col-6 col-md-3">
                    <div class="stat-card">
                        <div class="d-flex align-items-center justify-content-between mb-2">
                            <div class="icon text-bg-primary"><i class="bi bi-calendar-event"></i></div>
                            <span class="badge bg-light text-dark">今日</span>
                        </div>
                        <div class="value">${data.today_appointments}</div>
                        <div class="label">今日预约 <small class="text-success ms-1">到访 ${data.today_visited}</small></div>
                    </div>
                </div>
                <div class="col-6 col-md-3">
                    <div class="stat-card">
                        <div class="d-flex align-items-center justify-content-between mb-2">
                            <div class="icon text-bg-success"><i class="bi bi-cash"></i></div>
                            <span class="badge bg-light text-dark">本月</span>
                        </div>
                        <div class="value">${formatMoney(data.monthly_revenue)}</div>
                        <div class="label">业绩总额 · ${data.monthly_deals} 单成交</div>
                    </div>
                </div>
                <div class="col-6 col-md-3">
                    <div class="stat-card">
                        <div class="d-flex align-items-center justify-content-between mb-2">
                            <div class="icon text-bg-info"><i class="bi bi-person-plus"></i></div>
                            <span class="badge bg-light text-dark">本月</span>
                        </div>
                        <div class="value">${data.monthly_patients}</div>
                        <div class="label">新增患者 · ${data.monthly_appointments} 次预约</div>
                    </div>
                </div>
                <div class="col-6 col-md-3">
                    <div class="stat-card">
                        <div class="d-flex align-items-center justify-content-between mb-2">
                            <div class="icon text-bg-warning"><i class="bi bi-telephone-forward"></i></div>
                            <span class="badge bg-light text-dark">待跟进</span>
                        </div>
                        <div class="value">${data.pending_followups}</div>
                        <div class="label">30天内未成交初诊</div>
                    </div>
                </div>
            </div>

            <div class="row g-3">
                <!-- 业绩趋势图 -->
                <div class="col-12 col-lg-8">
                    <div class="chart-container">
                        <h6 class="fw-bold mb-3">📈 本月业绩趋势</h6>
                        <canvas id="revenueChart" height="200"></canvas>
                    </div>
                </div>
                <!-- 咨询师排名 -->
                <div class="col-12 col-lg-4">
                    <div class="chart-container">

        if (window._revenueChart) {
            window._revenueChart.destroy();
            window._revenueChart = null;
        }
        window._revenueTimer = setTimeout(() => {
            const canvas = document.getElementById('revenueChart');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            canvas.style.width = '100%';
            canvas.style.maxHeight = '280px';
            window._revenueChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: data.revenue_trend.map(d => d.date),
                    datasets: [{
                        label: '业绩 (RM)',
                        data: data.revenue_trend.map(d => d.amount),
                        backgroundColor: 'rgba(76, 201, 240, 0.7)',
                        borderColor: '#4cc9f0',
                        borderWidth: 1,
                        borderRadius: 4,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: { callback: v => 'RM ' + v.toLocaleString() }
                        },
                        x: {
                            ticks: {
                                maxRotation: 45,
                                autoSkip: true,
                                maxTicksLimit: 15
                            }
                        }
                    }
                }
            });
        }, 100);

    } catch (e) {
        body.innerHTML = `<div class="alert alert-danger">加载失败: ${e.message}</div>`;
    }
}

function formatVisitBadge(status) {
    const map = {
        '成交': 'success',
        '定金': 'warning',
        '定金转成交': 'success',
        '未成交转成交': 'info',
        '未成交': 'secondary',
        '未到访': 'danger',
        '无效': 'dark',
        '补费': 'primary',
    };
    const cls = map[status] || 'light';
    return status ? `<span class="badge bg-${cls}">${status}</span>` :
           `<span class="badge bg-light text-muted">待确认</span>`;
}

function renderDetailTreatmentPlans(plans) {
    if (!plans || plans.length === 0) {
        return '<p class="text-muted small">暂无治疗方案</p>';
    }
    const checks = plans.filter(p => p.section === '检查');
    const treatments = plans.filter(p => p.section === '治疗方案');
    let html = '';
    
    function renderDetailItem(list) {
        return list.map(item => {
            const m = parseToothJson(item.tooth_mark);
            const batchLabel = item.batch ? `<span class="badge bg-secondary me-1">${escapeHtml(item.batch)}</span>` : '';
            const costItems = item.cost_items || [];
            let costHtml = '';
            if (costItems.length > 0) {
                costHtml = `
                <div class="table-responsive mt-1">
                    <table class="table table-sm table-borderless mb-0" style="font-size:11px">
                        <thead>
                            <tr style="background:#fff5f5">
                                <th>大类</th><th>小类</th><th class="text-end">数量</th><th class="text-end">单价</th><th class="text-end">折扣</th><th class="text-end">总价</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${costItems.map(ci => `
                                <tr>
                                    <td>${escapeHtml(ci.major_category) || '-'}</td>
                                    <td>${escapeHtml(ci.sub_category) || '-'}</td>
                                    <td class="text-end">${ci.quantity || 1}</td>
                                    <td class="text-end">${formatMoney(ci.unit_price)}</td>
                                    <td class="text-end">${ci.discount_rate || 0}%</td>
                                    <td class="text-end fw-bold">${formatMoney(ci.total_price)}</td>
                                </tr>
                            `).join('')}
                            <tr style="border-top:1px solid #e94560;font-weight:700">
                                <td colspan="5" class="text-end" style="color:#e94560">小计</td>
                                <td class="text-end fw-bold">${formatMoney(item.cost_total || 0)}</td>
                            </tr>
                        </tbody>
                    </table>
                </div>`;
            }
            return `
                <div class="mb-2">
                    <div class="d-flex gap-2 align-items-start">
                        ${batchLabel}
                        <div class="tooth-cross-mini-grid">
                            <div class="tcm-cell tcm-ur"><code>${escapeHtml(m.UR) || '-'}</code></div>
                            <div class="tcm-cell tcm-ul"><code>${escapeHtml(m.UL) || '-'}</code></div>
                            <div class="tcm-cell tcm-lr"><code>${escapeHtml(m.LR) || '-'}</code></div>
                            <div class="tcm-cell tcm-ll"><code>${escapeHtml(m.LL) || '-'}</code></div>
                        </div>
                        <div class="text-muted small" style="flex:1">${escapeHtml(item.note) || '-'}</div>
                    </div>
                    ${costHtml}
                </div>`;
        }).join('');
    }

    if (checks.length > 0) {
        html += '<div class="mb-2"><span class="badge bg-success small">检查</span></div>';
        html += renderDetailItem(checks);
    }
    if (treatments.length > 0) {
        html += '<div class="mb-2"><span class="badge bg-primary small">治疗方案</span></div>';
        html += renderDetailItem(treatments);
    }
    return html;
}

                    </tbody>
                </table>

            <div class="d-flex justify-content-between align-items-center p-3 border-top">
                <small class="text-muted" id="patientTotal">共 0 条</small>
                <nav><ul class="pagination pagination-sm mb-0" id="patientPagination"></ul></nav>
            </div>
        </div>
    `;

    document.getElementById('patientSearch').addEventListener('input', (e) => {
        patientSearch = e.target.value;
        patientPage = 1;
        loadPatients();
    });

    // Date filter buttons
    document.querySelectorAll('#dateFilterBtns .btn').forEach(btn => {
        btn.addEventListener('click', function() {
            patientFilterDate = this.dataset.date;
            patientPage = 1;
            document.querySelectorAll('#dateFilterBtns .btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            loadPatients();
        });
    });

    loadPatients();

    // Enter to search
    document.getElementById('patientSearch').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            patientPage = 1;
            loadPatients();
        }
    });
}

async function loadPatients() {
    const tbody = document.getElementById('patientTableBody');
    try {
        const res = await fetch(`/api/patients?page=${patientPage}&per_page=20&search=${encodeURIComponent(patientSearch)}&date=${encodeURIComponent(patientFilterDate)}`);
        const data = await res.json();

        if (data.data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4 text-muted">暂无患者</td></tr>';
        } else {
            tbody.innerHTML = data.data.map(p => `
                <tr onclick="openPatientDetail(${p.id})">
                    <td><strong>${escapeHtml(p.name)}</strong></td>
                    <td class="small text-muted">${escapeHtml(p.internal_id) || '-'}</td>
                    <td>${escapeHtml(p.phone) || '-'}</td>
                    <td>${escapeHtml(p.tooth_count) || '-'}</td>
                    <td>${escapeHtml(p.inviter) || '-'}</td>
                    <td class="small">${p.scheduled_date || '-'}</td>
                    <td onclick="event.stopPropagation()">
                        <button class="btn btn-outline-danger btn-sm py-0" onclick="deletePatient(${p.id})">
                            <i class="bi bi-trash"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        document.getElementById('patientTotal').textContent = `共 ${data.total} 条`;
        renderPagination('patientPagination', data.page, data.pages, (p) => {
            patientPage = p;
            loadPatients();
        });

    } catch (e) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center py-4 text-danger">加载失败: ${e.message}</td></tr>`;
    }
}

async function savePatientForm() {
    const id = document.getElementById('patientId').value;
    const data = {
        name: document.getElementById('pName').value.trim(),
        phone: document.getElementById('pPhone').value.trim(),
        gender: document.getElementById('pGender').value,
        age: parseInt(document.getElementById('pAge').value) || 0,
        tooth_count: document.getElementById('pToothCount').value,
        source: document.getElementById('pSource').value,
        online_consultant: document.getElementById('pConsultant').value.trim(),
        condition_desc: document.getElementById('pCondition').value.trim(),
    };
    if (!data.name) { showToast('请输入患者姓名', 'error'); return; }

    try {
        const url = id ? `/api/patients/${id}` : '/api/patients';
        const method = id ? 'PUT' : 'POST';
        const res = await fetch(url, { method, headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) });
        const result = await res.json();
        if (result.success) {
            showToast(id ? '患者已更新' : '患者已创建');
            bootstrap.Modal.getInstance(document.getElementById('formModal')).hide();
            loadPatients();
        } else {
            showToast(result.error || '保存失败', 'error');
        }
    } catch (e) {
        showToast('保存失败: ' + e.message, 'error');
    }
}

async function deletePatient(pid) {
    if (!confirm('确认删除该患者吗？所有关联的预约和交易记录也会被删除。')) return;
    try {
        const res = await fetch(`/api/patients/${pid}`, {method: 'DELETE'});
        const data = await res.json();
        if (data.success) {
            showToast('已删除');
            loadPatients();
        }
    } catch (e) {
        showToast('删除失败', 'error');
    }
}

// ===================== Pagination =====================

function renderPagination(containerId, current, total, onClick) {
    const container = document.getElementById(containerId);
    if (!container) return;
    if (total <= 1) { container.innerHTML = ''; return; }

    let html = '';
    const addPage = (p, label) => {
        html += `<li class="page-item ${p === current ? 'active' : ''}">
            <a class="page-link" href="#" data-page="${p}">${label || p}</a></li>`;
    };

    addPage(1);
    if (current > 3) html += '<li class="page-item disabled"><span class="page-link">...</span></li>';
    for (let p = Math.max(2, current - 1); p <= Math.min(total - 1, current + 1); p++) {
        addPage(p);
    }
    if (current < total - 2) html += '<li class="page-item disabled"><span class="page-link">...</span></li>';
    if (total > 1) addPage(total);

    container.innerHTML = html;
    container.querySelectorAll('a.page-link').forEach(el => {
        el.addEventListener('click', (e) => {
            e.preventDefault();
            onClick(parseInt(el.dataset.page));
        });
    });
}

async function saveTransactionForm() {

function loadReports() {
    // Destroy old charts
    ['chartApptDaily','chartRevDaily','chartInviterAppt','chartConsultantRev','chartCollection'].forEach(function(id) {
        if (window['_'+id]) window['_'+id].destroy();
    });
    
    fetch('/api/reports/monthly?year=' + reportYear + '&month=' + reportMonth).then(function(r) { return r.json(); }).then(function(data) {
        function makeBar(canvasId, labels, values, color, label, formatVal) {
            var ctx = document.getElementById(canvasId);
            if (!ctx) return;
            formatVal = formatVal || function(v) { return v; };
            window['_'+canvasId] = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{ label: label, data: values, backgroundColor: color + '90', borderColor: color, borderWidth: 1, borderRadius: 4 }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { display: false },
                        datalabels: {
                            anchor: 'end',
                            align: 'top',
                            font: { size: 9, weight: 'bold' },
                            formatter: formatVal,
                            color: '#333'
                        }
                    },
                    scales: { y: { beginAtZero: true, grace: '15%', ticks: { callback: formatVal } } }
                }
            });
        }

        // 1. 每日预约
        makeBar('chartApptDaily',
            data.daily_appointments.map(function(d) { return d.date; }),
            data.daily_appointments.map(function(d) { return d.count; }),
            '#4361ee', '预约数');

        // 2. 每日成交金额
        makeBar('chartRevDaily',
            data.daily_revenue.map(function(d) { return d.date; }),
            data.daily_revenue.map(function(d) { return d.amount; }),
            '#10b981', '成交金额(RM)',
            function(v) { return 'RM ' + v.toLocaleString(); });

        // 3. 网咨人员预约数量 (horizontal bar)
        var ctx3 = document.getElementById('chartInviterAppt');
        if (ctx3 && data.inviter_appointments.length > 0) {
            window._chartInviterAppt = new Chart(ctx3, {
                type: 'bar',
                data: {
                    labels: data.inviter_appointments.map(function(d) { return d.name; }),
                    datasets: [{ label: '预约数', data: data.inviter_appointments.map(function(d) { return d.count; }),
                        backgroundColor: '#f59e0b90', borderColor: '#f59e0b', borderWidth: 1, borderRadius: 4 }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    plugins: {
                        legend: { display: false },
                        datalabels: { anchor: 'end', align: 'right', font: { size: 10, weight: 'bold' }, color: '#333' }
                    },
                    scales: { x: { beginAtZero: true, grace: '15%' } }
                }
            });
        }

        // 4. 网咨人员成交金额 (horizontal bar)
        var ctx4 = document.getElementById('chartConsultantRev');
        if (ctx4 && data.consultant_revenue.length > 0) {
            window._chartConsultantRev = new Chart(ctx4, {
                type: 'bar',
                data: {
                    labels: data.consultant_revenue.map(function(d) { return d.name + ' (' + d.count + '单)'; }),
                    datasets: [{ label: '成交额(RM)', data: data.consultant_revenue.map(function(d) { return d.total; }),
                        backgroundColor: '#8b5cf690', borderColor: '#8b5cf6', borderWidth: 1, borderRadius: 4 }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    plugins: {
                        legend: { display: false },
                        datalabels: {
                            anchor: 'end', align: 'right', font: { size: 10, weight: 'bold' }, color: '#333',
                            formatter: function(v) { return 'RM ' + v.toLocaleString(); }
                        }
                    },
                    scales: { x: { beginAtZero: true, grace: '15%', ticks: { callback: function(v) { return 'RM '+v.toLocaleString(); } } } }
                }
            });
        }

        // 5. 每日收款金额
        makeBar('chartCollection',
            data.daily_collection.map(function(d) { return d.date; }),
            data.daily_collection.map(function(d) { return d.amount; }),
            '#ef4444', '收款金额(RM)',
            function(v) { return 'RM ' + v.toLocaleString(); });

    }).catch(function(e) {
        document.getElementById('pageBody').innerHTML = '<div class="alert alert-danger">加载失败: ' + e.message + '</div>';
    });
}

    { key: '左侧咬合', label: '左侧咬合' },
    { key: '正面咬合', label: '正面咬合' },
    { key: '右侧咬合', label: '右侧咬合' },
    { key: '下颌颌面', label: '下颌颌面' },
];

var piPatientId = null;
var piStage = '术前';

    piPatientId = null;
    window._piPage = 1;
    var body = document.getElementById('pageBody');
    body.innerHTML = '' +
        '<div class="d-flex flex-wrap align-items-center gap-2 mb-3">' +
        '<div class="input-group" style="max-width:300px">' +
        '<input class="form-control form-control-sm" id="piSearchFilter" placeholder="搜索患者姓名/电话..." oninput="filterPatientImageList()">' +

        '<div class="table-responsive">' +

async function loadPatientImageSummary(page) {
    try {
        var search = (document.getElementById('piSearchFilter') || {}).value || '';
        var url = '/api/patients/images-summary?page=' + page + '&per_page=20';
        if (search.trim()) url += '&search=' + encodeURIComponent(search.trim());
        var res = await fetch(url);
        var data = await res.json();
        window._piSummaryData = data.data;
        window._piTotal = data.total;
        window._piPage = data.page;
        window._piPerPage = data.per_page;
        renderPatientImageSummary(data);
    } catch (e) {
        document.getElementById('piSummaryBody').innerHTML = '<tr><td colspan="6" class="text-center text-danger py-4">加载失败: ' + e.message + '</td></tr>';
    }
}

function renderPatientImageSummary(data) {
    var list = data.data;
    var total = data.total;
    var page = data.page;
    var perPage = data.per_page;
    var totalPages = Math.ceil(total / perPage);
    
    var tbody = document.getElementById('piSummaryBody');
    if (!tbody) return;
    
    if (list.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4">暂无符合条件的患者</td></tr>';
        document.getElementById('piSummaryCount').textContent = '';
        document.getElementById('piPagination').innerHTML = '';
        return;
    }
    
    var preTotal = 0, postTotal = 0;
    for (var i = 0; i < list.length; i++) {
        preTotal += list[i].pre_count;
        postTotal += list[i].post_count;
    }
    
    var html = '';
    for (var i = 0; i < list.length; i++) {
        var p = list[i];
        var apptDate = p.latest_appointment || '—';
        html += '<tr class="pi-row" style="cursor:pointer" onclick="selectPatientFromList(' + p.id + ')">';
        html += '<td><span class="fw-medium">' + escapeHtml(p.name) + '</span></td>';
        html += '<td class="text-muted small">' + escapeHtml(p.phone) + '</td>';
        html += '<td class="text-center text-muted small">' + apptDate + '</td>';
        html += '<td class="text-center"><span class="badge bg-primary bg-opacity-10 text-primary">' + p.pre_count + '</span></td>';
        html += '<td class="text-center"><span class="badge bg-success bg-opacity-10 text-success">' + p.post_count + '</span></td>';
        html += '<td class="text-center fw-bold">' + (p.pre_count + p.post_count) + '</td>';
        html += '</tr>';
    }
    tbody.innerHTML = html;
    
    document.getElementById('piSummaryCount').textContent = '共 ' + total + ' 位患者 | 本页术前 ' + preTotal + ' 张 · 术后 ' + postTotal + ' 张';
    
    // Pagination controls
    var pag = document.getElementById('piPagination');
    var pagHtml = '<span class="text-muted small">第 ' + page + '/' + totalPages + ' 页</span>';
    pagHtml += '<div class="btn-group btn-group-sm">';
    pagHtml += '<button class="btn btn-outline-secondary btn-sm" onclick="loadPatientImageSummary(' + (page - 1) + ')" ' + (page <= 1 ? 'disabled' : '') + '><i class="bi bi-chevron-left"></i> 上一页</button>';
    pagHtml += '<button class="btn btn-outline-secondary btn-sm" onclick="loadPatientImageSummary(' + (page + 1) + ')" ' + (page >= totalPages ? 'disabled' : '') + '>下一页 <i class="bi bi-chevron-right"></i></button>';
    pagHtml += '</div>';
    pag.innerHTML = pagHtml;
}

function filterPatientImageList() {
    var q = (document.getElementById('piSearchFilter').value || '').trim().toLowerCase();
    if (!q) { loadPatientImageSummary(1); return; }
    // Search: call API with search param if supported, or client-side filter on current page
    loadPatientImageSummary(1);
}

function selectPatientFromList(pid) {
    piPatientId = pid;
    piStage = '术前';
    
    // Find patient name from summary data
    var all = window._piSummaryData || [];
    var patient = null;
    for (var i = 0; i < all.length; i++) {
        if (all[i].id === pid) { patient = all[i]; break; }
    }
    var name = patient ? patient.name : '患者#' + pid;
    
    var body = document.getElementById('pageBody');
    body.innerHTML = '' +
        '<div class="d-flex flex-wrap align-items-center gap-2 mb-3">' +
        '<button class="btn btn-outline-secondary btn-sm" onclick="showPatientImageList()"><i class="bi bi-arrow-left"></i> 返回清单</button>' +
        '<div class="btn-group btn-group-sm" id="piStageToggle">' +
        '<button class="btn btn-outline-primary active" data-stage="术前">术前</button>' +
        '<button class="btn btn-outline-success" data-stage="术后">术后</button>' +
        '</div>' +
        '<span class="fw-medium">' + escapeHtml(name) + '</span>' +
        '</div>' +
        '<div id="piImagesArea"></div>';

    document.getElementById('piStageToggle').addEventListener('click', function(e) {
        var btn = e.target.closest('button');
        if (!btn) return;
        piStage = btn.dataset.stage;
        document.querySelectorAll('#piStageToggle .btn').forEach(function(b) { b.classList.remove('active'); });
        btn.classList.add('active');
        loadPatientImages();
    });
    
    loadPatientImages();
}

async function loadPatientImages() {
    var area = document.getElementById('piImagesArea');
    if (!piPatientId) return;

    try {
        var res = await fetch('/api/patients/' + piPatientId + '/images');
        var data = await res.json();
        var images = data.data.filter(function(img) { return img.stage === piStage; });

        var panImages = images.filter(function(img) { return img.category === '全景片'; });

        var intraoralImages = {};
        INTRAORAL_TYPES.forEach(function(t) { intraoralImages[t.key] = []; });
        intraoralImages['特写照'] = [];
        images.filter(function(img) { return img.category === '口内照'; }).forEach(function(img) {
            var key = img.sub_type || '特写照';
            if (!intraoralImages[key]) intraoralImages[key] = [];
            intraoralImages[key].push(img);
        });

        var html = '';
        html += '<div class="chart-container mb-3"><h6 class="fw-bold mb-3"><i class="bi bi-image"></i> 全景片</h6>';
        html += renderImageSlots('全景片', '', panImages);
        html += '</div>';

        html += '<div class="chart-container"><h6 class="fw-bold mb-3"><i class="bi bi-camera"></i> 口内照</h6>';
        html += '<div class="row g-3 mb-3"><div class="col-4 mx-auto">' + renderImageCard('上颌颌面', intraoralImages['上颌颌面']) + '</div></div>';
        html += '<div class="row g-3 mb-3"><div class="col-4">' + renderImageCard('左侧咬合', intraoralImages['左侧咬合']) + '</div><div class="col-4">' + renderImageCard('正面咬合', intraoralImages['正面咬合']) + '</div><div class="col-4">' + renderImageCard('右侧咬合', intraoralImages['右侧咬合']) + '</div></div>';
        html += '<div class="row g-3 mb-3"><div class="col-4 mx-auto">' + renderImageCard('下颌颌面', intraoralImages['下颌颌面']) + '</div></div>';
        html += '<div class="row g-3 mb-3">' + renderCloseupSlots(intraoralImages['特写照']) + '</div>';
        html += '<button class="btn btn-outline-primary btn-sm" onclick="addCloseupSlot()"><i class="bi bi-plus-circle"></i> 增加特写及合影</button>';
        html += '</div>';

        area.innerHTML = html;
    } catch (e) {
        area.innerHTML = '<div class="alert alert-danger">加载失败: ' + e.message + '</div>';
    }
}

function renderImageSlots(category, subType, images) {
    var existing = images.length > 0 ? images : [null];
    return existing.map(function(img) {
        if (img) {
            return '<div class="d-inline-block position-relative me-2 mb-2" style="width:160px">' +
                '<a href="' + img.url + '" target="_blank"><img src="' + img.url + '" class="img-thumbnail" style="width:160px;height:120px;object-fit:cover"></a>' +
                '<button class="btn btn-danger btn-sm position-absolute top-0 end-0 rounded-circle" style="width:22px;height:22px;padding:0;font-size:10px;line-height:20px" onclick="deleteImage(' + img.id + ')">&times;</button>' +
                '<div class="small text-muted text-truncate" style="width:160px">' + escapeHtml(img.original_name) + '</div>' +
                '<button class="btn btn-outline-secondary btn-sm mt-1 w-100" onclick="triggerUpload(\'' + category + '\',\'' + subType + '\')"><i class="bi bi-plus"></i></button>' +
            '</div>';
        }
        return '<div class="d-inline-block me-2 mb-2"><div class="border rounded d-flex align-items-center justify-content-center bg-light" style="width:160px;height:120px;cursor:pointer" onclick="triggerUpload(\'' + category + '\',\'' + subType + '\')"><div class="text-center text-muted"><i class="bi bi-cloud-upload" style="font-size:1.5em"></i><div class="small">上传图片</div></div></div></div>';
    }).join('');
}

function renderImageCard(label, images) {
    var h = '<div class="border rounded p-2 text-center bg-light" style="min-height:180px"><div class="fw-bold small mb-2">' + label + '</div><div>';
    if (images.length > 0) {
        h += images.map(function(img) {
            return '<div class="position-relative d-inline-block mb-1"><a href="' + img.url + '" target="_blank"><img src="' + img.url + '" class="img-thumbnail" style="width:100%;max-height:130px;object-fit:cover"></a><button class="btn btn-danger btn-sm position-absolute top-0 end-0 rounded-circle" style="width:18px;height:18px;padding:0;font-size:9px;line-height:16px" onclick="deleteImage(' + img.id + ')">&times;</button></div>';
        }).join('');
        h += '<button class="btn btn-outline-secondary btn-sm mt-1 w-100" onclick="triggerUpload(\'口内照\',\'' + label + '\')"><i class="bi bi-plus"></i></button>';
    } else {
        h += '<div class="border border-dashed rounded d-flex align-items-center justify-content-center bg-white" style="height:110px;cursor:pointer" onclick="triggerUpload(\'口内照\',\'' + label + '\')"><div class="text-center text-muted"><i class="bi bi-plus-circle" style="font-size:1.3em"></i><div class="small">点击上传</div></div></div>';
    }
    return h + '</div></div>';
}

function renderCloseupSlots(images) {
    var total = Math.max(images.length, 3);
    var h = '';
    for (var i = 0; i < total; i++) {
        var img = i < images.length ? images[i] : null;
        h += '<div class="col-4"><div class="border rounded p-2 text-center bg-light" style="min-height:150px"><div class="fw-bold small mb-2">特写及合影 ' + (i+1) + '</div>';
        if (img) {
            h += '<div class="position-relative d-inline-block"><a href="' + img.url + '" target="_blank"><img src="' + img.url + '" class="img-thumbnail" style="width:100%;max-height:130px;object-fit:cover"></a><button class="btn btn-danger btn-sm position-absolute top-0 end-0 rounded-circle" style="width:18px;height:18px;padding:0;font-size:9px;line-height:16px" onclick="deleteImage(' + img.id + ')">&times;</button></div>';
            h += '<button class="btn btn-outline-secondary btn-sm mt-1 w-100" onclick="triggerUpload(\'口内照\',\'特写照\')"><i class="bi bi-plus"></i></button>';
        } else {
            h += '<div class="border border-dashed rounded d-flex align-items-center justify-content-center bg-white" style="height:110px;cursor:pointer" onclick="triggerUpload(\'口内照\',\'特写照\')"><div class="text-center text-muted"><i class="bi bi-plus-circle" style="font-size:1.3em"></i><div class="small">点击上传</div></div></div>';
        }
        h += '</div></div>';
    }
    return h;
}

var piFileInput = null;
var piUploadCategory = '';
var piUploadSubType = '';

function triggerUpload(category, subType) {
    piUploadCategory = category;
    piUploadSubType = subType;
    if (!piFileInput) {
        piFileInput = document.createElement('input');
        piFileInput.type = 'file';
        piFileInput.accept = 'image/*';
        piFileInput.style.display = 'none';
        document.body.appendChild(piFileInput);
        piFileInput.addEventListener('change', handleImageUpload);
    }
    piFileInput.click();
}

async function handleImageUpload(e) {
    var file = e.target.files[0];
    if (!file || !piPatientId) return;
    var fd = new FormData();
    fd.append('file', file);
    fd.append('stage', piStage);
    fd.append('category', piUploadCategory);
    fd.append('sub_type', piUploadSubType);
    try {
        var res = await fetch('/api/patients/' + piPatientId + '/images', { method: 'POST', body: fd });
        var d = await res.json();
        if (d.success) { showToast('图片已上传'); loadPatientImages(); }
        else { showToast(d.error || '上传失败', 'error'); }
    } catch (e) { showToast('上传失败: ' + e.message, 'error'); }
    piFileInput.value = '';
}

async function deleteImage(iid) {
    if (!confirm('确认删除这张图片？')) return;
    try {
        var res = await fetch('/api/images/' + iid, { method: 'DELETE' });
        var d = await res.json();
        if (d.success) { showToast('已删除'); loadPatientImages(); }
    } catch (e) { showToast('删除失败', 'error'); }
}

function addCloseupSlot() {
    triggerUpload('口内照', '特写照');
}

let tpSelectedPid = null;
let tpSelectedName = '';

// Parse tooth_mark JSON or return defaults
function parseToothJson(str) {
    try {
        if (str && str.startsWith('{')) return JSON.parse(str);
    } catch(e) {}
    return { UR: '', UL: '', LL: '', LR: '' };
}

function renderToothCrossInput(markStr, itemId, section) {
    const m = parseToothJson(markStr);
    return `
        <div class="tooth-cross" data-id="${itemId}">
            <div class="tooth-cross-grid">
                <div class="tc-cell tc-ur">
                    <input class="form-control form-control-sm tc-input" value="${escapeHtml(m.UR)}" placeholder="">
                </div>
                <div class="tc-cell tc-ul">
                    <input class="form-control form-control-sm tc-input" value="${escapeHtml(m.UL)}" placeholder="">
                </div>
                <div class="tc-cell tc-lr">
                    <input class="form-control form-control-sm tc-input" value="${escapeHtml(m.LR)}" placeholder="">
                </div>
                <div class="tc-cell tc-ll">
                    <input class="form-control form-control-sm tc-input" value="${escapeHtml(m.LL)}" placeholder="">
                </div>
            </div>
        </div>`;
}

function collectToothCross(row) {
    const inputs = row.querySelectorAll('.tc-input');
    if (inputs.length === 4) {
        return JSON.stringify({
            UR: inputs[0].value.trim(),
            UL: inputs[1].value.trim(),
            LR: inputs[2].value.trim(),
            LL: inputs[3].value.trim(),
        });
    }
    return '';
}

async function loadTpPatientList() {
    try {
        // Load all patients
        const res = await fetch('/api/patients?per_page=500');
        const d = await res.json();
        const sel = document.getElementById('tpPatientSelect');
        if (!sel) return;
        sel.innerHTML = '<option value="">-- 请选择患者 --</option>' +
            d.data.map(p => `<option value="${p.id}">${escapeHtml(p.name)} - ${escapeHtml(p.phone)} (${escapeHtml(p.internal_id)})</option>`).join('');

        sel.addEventListener('change', function() {
            const pid = this.value;
            if (pid) {
                const opt = this.options[this.selectedIndex];
                tpSelectedPid = parseInt(pid);
                tpSelectedName = opt.text;
                loadTreatmentPlanEditor(tpSelectedPid);
            } else {
                tpSelectedPid = null;
                document.getElementById('tpContent').innerHTML = '<div class="text-center py-5 text-muted"><i class="bi bi-clipboard2-heart" style="font-size:3rem"></i><p class="mt-2">请先选择患者</p></div>';
            }
        });
    } catch (e) {
        console.error('Failed to load patient list:', e);
    }
}

function renderTpItemList(items, section) {

        return '<p class="text-muted small mb-0">暂无记录，点击"添加"按钮新增</p>';
    }
    return items.map((item, idx) => {
        const costItems = item.cost_items || [];
        const costTotal = item.cost_total || 0;
        return `
        <div data-id="${item.id}" style="border:1px solid #e0e0e0;border-radius:8px;padding:14px;margin-bottom:12px;background:#fff">
            <div class="row g-2 align-items-start">
                ${section === '治疗方案' ? `
                <div class="col-auto">
                    <label class="form-label small mb-1">批次</label>
                    <select class="form-select form-select-sm tp-batch" style="width:90px">
                        <option value="">-</option>
                        ${['批次一','批次二','批次三','批次四','批次五'].map(b => `<option value="${b}" ${item.batch === b ? 'selected' : ''}>${b}</option>`).join('')}
                    </select>
                </div>
                ` : ''}
                <div class="col-auto">
                    <label class="form-label small mb-1">牙位</label>
                    ${renderToothCrossInput(item.tooth_mark, item.id)}
                </div>
                <div class="col">
                    <label class="form-label small mb-1">备注</label>
                    <input class="form-control form-control-sm tp-note" value="${escapeHtml(item.note)}"
                           placeholder="检查/治疗方案备注" data-id="${item.id}">
                </div>
                <div class="col-auto d-flex gap-1 align-items-end" style="padding-bottom:2px">
                    <button class="btn btn-outline-secondary btn-sm" style="padding:2px 6px;font-size:11px"
                            onclick="saveTpItem(${item.id})" title="保存">💾</button>
                    <button class="btn btn-outline-danger btn-sm" style="padding:2px 6px;font-size:11px"
                            onclick="deleteTpItem(${item.id})" title="删除">🗑</button>
                </div>
            </div>
            ${section === '治疗方案' ? renderCostItemSection(item.id, costItems, costTotal) : ''}
        </div>`;
    }).join('');
}

const COST_MAJOR_CATS = ['种植体', '牙冠', '基台', '骨粉', '骨膜', '内外提', '其他'];

function renderCostItemSection(tid, costItems, costTotal) {
    const items = costItems || [];
    const total = costTotal || 0;
    let html = `
        <hr class="my-2">
        <div class="d-flex justify-content-between align-items-center mb-2">
            <span class="fw-bold small" style="color:#e94560">💲 费用明细</span>
            <button class="btn btn-outline-danger btn-sm py-0 px-2" onclick="addCostItem(${tid})" style="font-size:11px">
                <i class="bi bi-plus"></i> 添加
            </button>
        </div>`;

    if (items.length === 0) {
        html += '<p class="text-muted small mb-1">暂无费用项</p>';
    } else {
        html += `

function renderCostItemRow(tid, ci) {
    const majorOptions = COST_MAJOR_CATS.map(c =>
        `<option value="${c}" ${ci.major_category === c ? 'selected' : ''}>${c}</option>`
    ).join('');
    return `
        <tr class="cost-item-row" data-cid="${ci.id}">
            <td>
                <select class="form-select form-select-sm ci-major" style="font-size:11px;padding:2px 4px">
                    <option value="">-</option>
                    ${majorOptions}
                </select>
            </td>
            <td>
                <input class="form-control form-control-sm ci-sub" style="font-size:11px;padding:2px 4px"
                       value="${escapeHtml(ci.sub_category)}" placeholder="品牌/型号">
            </td>
            <td>
                <input class="form-control form-control-sm ci-qty" type="number" min="1" style="font-size:11px;padding:2px 4px;width:55px"
                       value="${ci.quantity || 1}" onchange="recalcCostRow(this)">
            </td>
            <td>
                <input class="form-control form-control-sm ci-unit-price text-end" type="number" step="0.01" style="font-size:11px;padding:2px 4px"
                       value="${ci.unit_price || 0}" onchange="recalcCostRow(this)">
            </td>
            <td>
                <div class="input-group input-group-sm" style="font-size:11px">
                    <input class="form-control form-control-sm ci-discount text-end" type="number" step="1" min="0" max="100" style="font-size:11px;padding:2px 4px"
                           value="${ci.discount_rate || 0}" onchange="recalcCostRow(this)">
                    <span class="input-group-text" style="font-size:10px;padding:2px 4px">%</span>
                </div>
            </td>
            <td class="text-end fw-bold ci-total-cell">
                ${formatMoney(ci.total_price || 0)}
            </td>
            <td>
                <button class="btn btn-outline-secondary btn-sm py-0 px-1" onclick="saveCostItem(${ci.id}, ${tid})" title="保存" style="font-size:10px">💾</button>
                <button class="btn btn-outline-danger btn-sm py-0 px-1" onclick="deleteCostItem(${ci.id}, ${tid})" title="删除" style="font-size:10px">🗑</button>
            </td>
        </tr>`;
}

function recalcCostRow(el) {
    const row = el.closest('tr');
    if (!row) return;
    const qty = parseInt(row.querySelector('.ci-qty').value) || 1;
    const unitPrice = parseFloat(row.querySelector('.ci-unit-price').value) || 0;
    const discount = parseFloat(row.querySelector('.ci-discount').value) || 0;
    const total = unitPrice * qty * (1 - discount / 100);
    row.querySelector('.ci-total-cell').textContent = formatMoney(total);
}

function collectCostItemData(row) {
    return {
        major_category: (row.querySelector('.ci-major') || {}).value || '',
        sub_category: (row.querySelector('.ci-sub') || {}).value || '',
        quantity: parseInt((row.querySelector('.ci-qty') || {}).value) || 1,
        unit_price: parseFloat((row.querySelector('.ci-unit-price') || {}).value) || 0,
        discount_rate: parseFloat((row.querySelector('.ci-discount') || {}).value) || 0,
        total_price: parseFloat((row.querySelector('.ci-unit-price') || {}).value || 0)
            * (parseInt((row.querySelector('.ci-qty') || {}).value) || 1)
            * (1 - (parseFloat((row.querySelector('.ci-discount') || {}).value) || 0) / 100),
    };
}

async function addCostItem(tid) {
    try {
        const res = await fetch('/api/treatment-plans/' + tid + '/cost-items', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ major_category: '', sub_category: '', unit_price: 0, quantity: 1, discount_rate: 0, total_price: 0, sort_order: Date.now() })
        });
        const d = await res.json();
        if (d.success) {
            loadTreatmentPlanEditor(tpSelectedPid);
            showToast('费用项已添加');
        }
    } catch (e) { showToast('添加失败', 'error'); }
}

async function saveCostItem(cid, tid) {
    const row = document.querySelector('.cost-item-row[data-cid="' + cid + '"]');
    if (!row) return;
    const data = collectCostItemData(row);
    try {
        const res = await fetch('/api/cost-items/' + cid, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        const d = await res.json();
        if (d.success) {
            showToast('已保存');
            // Recalculate the total for this treatment plan
            recalcCostSectionTotal(tid);
        }
    } catch (e) { showToast('保存失败', 'error'); }
}

async function deleteCostItem(cid, tid) {
    if (!confirm('确认删除此费用项？')) return;
    try {
        const res = await fetch('/api/cost-items/' + cid, { method: 'DELETE' });
        const d = await res.json();
        if (d.success) {
            loadTreatmentPlanEditor(tpSelectedPid);
            showToast('已删除');
        }
    } catch (e) { showToast('删除失败', 'error'); }
}

function recalcCostSectionTotal(tid) {
    const rows = document.querySelectorAll('#costTbody_' + tid + ' .cost-item-row');
    let total = 0;
    rows.forEach(row => {
        const cellText = row.querySelector('.ci-total-cell').textContent.replace('RM ', '').replace(/,/g, '');
        total += parseFloat(cellText) || 0;
    });
    const totalEl = document.getElementById('costTotal_' + tid);
    if (totalEl) totalEl.textContent = formatMoney(total);
}

async function loadConsultations(page = 1) {
    const search = document.getElementById('consSearch')?.value || '';
    const month = document.getElementById('consMonth')?.value || '';
    const hasAppt = document.getElementById('consApptFilter')?.value || '';

    try {
        const params = new URLSearchParams({ page, per_page: 20, search, month });
        if (hasAppt) params.set('has_appointment', hasAppt);

        const res = await fetch('/api/consultations?' + params);
        const data = await res.json();

        // 统计
        const total = data.data || [];
        const hasReply = total.filter(c => c.has_reply === '是').length;
        const hasApptCount = total.filter(c => c.has_appointment === '是').length;
        const pending = total.length - hasApptCount;

        const stats = document.getElementById('consStats');
        if (stats) {
            const scope = (month ? '本月' : (search ? '筛选' : '全部'));
            stats.innerHTML = `
                <div class="col-6 col-md-3">
                    <div class="stat-card"><div class="value">${data.total}</div><div class="label">${scope}咨询</div></div>
                </div>
                <div class="col-6 col-md-3">
                    <div class="stat-card"><div class="value">${hasReply}</div><div class="label">已回复</div></div>
                </div>
                <div class="col-6 col-md-3">
                    <div class="stat-card"><div class="value">${hasApptCount}</div><div class="label">已预约</div></div>
                </div>
                <div class="col-6 col-md-3">
                    <div class="stat-card"><div class="value">${pending}</div><div class="label">未预约</div></div>
                </div>
            `;
        }

        // 表格
        const tbody = document.getElementById('consTableBody');
        if (total.length === 0) {
            tbody.innerHTML = '<tr><td colspan="9" class="text-center py-4 text-muted">暂无数据</td></tr>';
        } else {
            tbody.innerHTML = total.map(c => `
                <tr>
                    <td class="small">${c.date || '-'}</td>
                    <td><strong>${escapeHtml(c.patient_name) || '-'}</strong></td>
                    <td class="small">${escapeHtml(c.patient_phone) || '-'}</td>
                    <td><code class="small">${escapeHtml(c.ad_code) || '-'}</code></td>
                    <td>${escapeHtml(c.consultant) || '-'}</td>
                    <td><span class="badge ${c.has_reply === '是' ? 'bg-success' : 'bg-secondary'}">${c.has_reply}</span></td>
                    <td><span class="badge ${c.has_appointment === '是' ? 'bg-primary' : 'bg-warning text-dark'}">${c.has_appointment}</span></td>
                    <td class="small">${c.appointment_date || '-'}</td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary me-1" onclick="editConsultation(${c.id})" title="编辑">
                            <i class="bi bi-pencil"></i>
                        </button>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteConsultation(${c.id})" title="删除">
                            <i class="bi bi-trash"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        // 分页
        const pag = document.getElementById('consPagination');
        if (data.pages > 1) {
            let phtml = '<div class="text-muted small">共 ' + data.total + ' 条</div>';
            phtml += '<nav><ul class="pagination pagination-sm mb-0">';
            for (let i = 1; i <= data.pages; i++) {
                phtml += `<li class="page-item ${i === page ? 'active' : ''}"><a class="page-link" href="#" onclick="loadConsultations(${i})">${i}</a></li>`;
            }
            phtml += '</ul></nav>';
            pag.innerHTML = phtml;
        } else {
            pag.innerHTML = '<div class="text-muted small">共 ' + data.total + ' 条</div>';
        }
    } catch (e) {
        document.getElementById('consTableBody').innerHTML = '<tr><td colspan="9" class="text-center py-4 text-danger">加载失败: ' + e.message + '</td></tr>';
    }
}

        }

        try {
            const url = id ? '/api/consultations/' + id : '/api/consultations';
            const method = id ? 'PUT' : 'POST';
            const res = await fetch(url, {
                method,
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            if (data.success) {
                bootstrap.Modal.getInstance(document.getElementById('formModal')).hide();
                const msg = hasAppt === '是' ? '咨询已录入，预约已自动推送到初诊预约' : '咨询已录入';
                showToast(msg, 'success');
                renderConsultations();
            } else {
                showToast(data.error || '保存失败', 'error');
            }
        } catch (e) {
            showToast('网络错误', 'error');
        }
    };

    // Bind save button
    document.querySelector('#formModal .btn-primary').onclick = window._saveConsultationForm;

    // 如果是编辑，填充数据
    if (isEdit) {
        fetch('/api/consultations/' + cid)
            .then(r => r.json())
            .then(d => {
                const c = d.data;
                document.getElementById('consDate').value = c.date || '';
                document.getElementById('consAdCode').value = c.ad_code || '';
                document.getElementById('consPatientName').value = c.patient_name || '';
                document.getElementById('consPatientPhone').value = c.patient_phone || '';
                document.getElementById('consConsultant').value = c.consultant || '';
                document.getElementById('consHasReply').value = c.has_reply || '否';
                document.getElementById('consHasAppointment').value = c.has_appointment || '否';
                if (c.has_appointment === '是') {
                    document.getElementById('consApptDate').value = c.appointment_date || '';
                    document.getElementById('consApptSuccessTime').value = c.appointment_success_time || '';
                    // 设置预约时间
                    const match = (c.appointment_time || '').match(/(\d+):(\d+)\s*(AM|PM)/i);
                    if (match) {
                        const hEl = document.getElementById('cons_hour');
                        const mEl = document.getElementById('cons_min');
                        const aEl = document.getElementById('cons_ampm');
                        if (hEl) hEl.value = match[1];
                        if (mEl) mEl.value = match[2];
                        if (aEl) aEl.value = match[3].toUpperCase();
                    }
                }
                toggleConsultAppointmentFields();
                flatpickr('.datetime-picker', { locale: 'zh', dateFormat: 'Y-m-d' });
                const se = document.getElementById('consApptSuccessTime');
                if (se) flatpickr(se, { locale: 'zh', enableTime: true, dateFormat: 'Y-m-d H:i' });
            });
    } else {
        // Initialize date pickers for new
        flatpickr('.datetime-picker', { locale: 'zh', dateFormat: 'Y-m-d' });
        const se = document.getElementById('consApptSuccessTime');
        if (se) flatpickr(se, { locale: 'zh', enableTime: true, dateFormat: 'Y-m-d H:i' });

        // Auto-fill: today's date and current user as consultant
        const today = new Date().toISOString().slice(0, 10);
        document.getElementById('consDate').value = today;
        const displayName = window.__displayName || '';
        if (displayName && displayName !== 'admin') {
            document.getElementById('consConsultant').value = displayName;
        }
    }

    const bsModal = new bootstrap.Modal(modal);
    bsModal.show();
}

// Reset save button when modal closes (prevent consultation hijacking)
document.getElementById('formModal').addEventListener('hidden.bs.modal', function() {
    var btn = this.querySelector('.btn-primary');
    if (btn) btn.onclick = null;
});

function toggleConsultAppointmentFields() {
    const sect = document.getElementById('consApptSection');
    const sel = document.getElementById('consHasAppointment');
    if (sel && sect) {
        sect.style.display = sel.value === '是' ? '' : 'none';
    }
}

async function editConsultation(cid) {
    showConsultationForm(cid);
}

async function deleteConsultation(cid) {
    if (!confirm('确定删除这条咨询记录吗？')) return;
    try {
        const res = await fetch('/api/consultations/' + cid, { method: 'DELETE' });
        const data = await res.json();
        if (data.success) {
            showToast('已删除', 'success');
            renderConsultations();
        } else {
            showToast('删除失败', 'error');
        }
    } catch (e) {
        showToast('网络错误', 'error');
    }
}

// ===================== Quick Upload from Patient Detail =====================

function goToPatientImages(pid) {
    bootstrap.Modal.getInstance(document.getElementById('detailModal')).hide();
    navigateTo('patient-images');
    // First load the summary, then auto-select the patient
    setTimeout(function() {
        var check = setInterval(function() {
            if (window._piSummaryData && window._piSummaryData.length > 0) {
                clearInterval(check);
                selectPatientFromList(pid);
            }
        }, 100);
        // Timeout after 3s
        setTimeout(function() { clearInterval(check); }, 3000);
    }, 200);
}
