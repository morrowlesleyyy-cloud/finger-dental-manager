# Render Blueprint - Docker Deployment
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: finger-dental-manager
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: "8888"
      - key: RENDER
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /var/data/clinic.db
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
